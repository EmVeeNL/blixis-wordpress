# Throwaway test stack for task 01-02. It is not the local site's stack.
# The database lives in tmpfs, no port is published, and nothing here reads
# ~/Sites/blixis. The project name keeps it apart from the `blixis` project.
# run-matrix.sh pipes the test files in as a tar stream, so there are no bind
# mounts: Docker Desktop served stale, truncated copies of edited files.
name: blixis-compat-spike

services:
  db:
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    environment:
      MARIADB_ROOT_PASSWORD: "${SPIKE_DB_ROOT_PASSWORD:?run through run-matrix.sh}"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

  runner:
    image: "${SPIKE_CLI_IMAGE:?run through run-matrix.sh}"
    profiles: ["run"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPIKE_DB_ROOT_PASSWORD: "${SPIKE_DB_ROOT_PASSWORD:?run through run-matrix.sh}"
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
