name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # Named bash adds pipefail, so a failing first command in a pipe fails the step.
    shell: bash

env:
  SPIKE_PACKAGE: blixis-compat-spike-frontend

jobs:
  php-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
          coverage: none
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Install locked PHP tools
        run: composer install --no-interaction --no-progress
      - name: Check PHP syntax on this version
        run: git ls-files '*.php' | xargs -r -n1 php -l
      - name: Run PHP_CodeSniffer (fix with vendor/bin/phpcbf where marked)
        run: composer lint

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Type check with TypeScript
        run: pnpm typecheck
      - name: Lint with Oxlint and oxlint-tsgolint
        run: pnpm lint
      - name: Check formatting with Oxfmt (fix with pnpm exec oxfmt in the package)
        run: pnpm format:check

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Build workspace packages
        run: pnpm build

  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The image holds the browsers for this Playwright version and their system packages.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    env:
      # Firefox refuses to start when HOME belongs to another user.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Build the page under test
        run: pnpm build
      - name: Run drag and drop tests
        run: >-
          pnpm --filter "$SPIKE_PACKAGE" exec playwright test
          --project=chromium-playwright --project=firefox-playwright --project=webkit-playwright

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: git ls-files '*.sh' | xargs -r -n1 bash -n
      - name: Run ShellCheck
        run: >-
          git ls-files '*.sh' | xargs -r docker run --rm -v "$PWD:/mnt" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
      - name: Test the link script on a temporary fake site
        run: bash scripts/test-setup-links.sh
      - name: Validate Compose configuration with placeholder values
        run: docker compose --env-file .env.example -f compose.yaml config --quiet
      - name: Parse tracked JSON files
        run: git ls-files '*.json' | xargs -r -n1 python3 -m json.tool --no-ensure-ascii > /dev/null
      - name: Lint workflows with actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  wordpress-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run theme, plugin, REST, revision, and preview smoke tests in a throwaway stack
        env:
          SPIKE_RESULTS: ${{ runner.temp }}/wordpress-matrix.jsonl
        run: >-
          spikes/01-02-compatibility/wordpress/run-matrix.sh
          "7.1.4 8.3 pass" "7.0.8 8.5 pass" "7.1.4 8.1 reject"
      - name: Report results and fail on any unmet expectation
        if: ${{ !cancelled() }}
        run: python3 spikes/01-02-compatibility/results/show.py "$RUNNER_TEMP/wordpress-matrix.jsonl"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # HEAD scans all reachable ancestry, including this PR's commits and main,
      # without scanning unrelated branch refs.
      - name: Scan this branch history with gitleaks
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --verbose --log-opts=HEAD .

  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Check licenses of installed packages
        run: pnpm --filter "$SPIKE_PACKAGE" run licenses

  # Not a required check: a new public advisory can fail it on any unrelated pull request.
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:2.10.3
          coverage: none
      - name: Audit JavaScript dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit
      - name: Audit PHP dependencies
        if: ${{ !cancelled() }}
        run: composer audit --locked --no-interaction
