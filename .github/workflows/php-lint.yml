name: PHP lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # Named bash adds pipefail, so a failing find fails the step.
    shell: bash

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation links and roadmap metadata
        run: python3 scripts/check-docs.py
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PHP syntax
        run: find themes plugins -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
